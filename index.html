<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="NAAC accreditation readiness for your college: fill or upload each metric workbook and see where you stand.">
    <meta name="theme-color" content="#C21B27">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Recognition Dashboard</title>
    <script>
      try {
        var t = localStorage.getItem('mode');
        document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
