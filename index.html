<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recognition Dashboard</title>
<meta name="description" content="Mockup of an IQAC dashboard for accreditation, rankings, ratings and awards across all schools. Illustrative data.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d2350'/%3E%3Cpath d='M16 6l3 6.5 7 .8-5.2 4.8 1.4 7L16 21.6 9.8 25.1l1.4-7L6 13.3l7-.8z' fill='%23e9b824'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#0d2350; --navy2:#173a7a; --gold:#e9b824; --gold-ink:#3a2c00;
  --acc:#1f5fae; --rank:#1e7a45; --rate:#c4561b; --award:#963a14;
  --bg:#f3f5f9; --card:#fff; --ink:#0f1b33; --muted:#5b6680; --line:#e1e6ef;
  --good:#1e7a45; --good-bg:#e3f3e9; --warn:#a96a00; --warn-bg:#fdf1d6;
  --bad:#b3261e; --bad-bg:#fbe4e2; --info:#1f5fae; --info-bg:#e3edfa; --mute-bg:#eef0f4;
  --sec:var(--navy);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}
button,select{font:inherit}

/* top bar */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer}
.mark{width:40px;height:40px;border-radius:9px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand small{display:block;color:#b8c4e0;font-size:12px}
.spacer{flex:1}
.inst{display:flex;align-items:center;gap:8px;font-size:13px;color:#b8c4e0}
.inst select{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:7px 10px;min-width:240px;font-weight:600}
.chip-sample{background:rgba(233,184,36,.18);color:var(--gold);border:1px solid rgba(233,184,36,.5);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}

.wrap{max-width:1280px;margin:0 auto;padding:20px}
.crumbs{font-size:13px;color:var(--muted);margin:0 0 12px}
.crumbs a{color:var(--acc);font-weight:600}

/* home hero */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border-radius:16px;padding:28px 30px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;border:40px solid rgba(255,255,255,.05)}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#b8c4e0;font-weight:700}
.hero h1{margin:6px 0 4px;font-size:34px;line-height:1.1;font-weight:800}
.hero h1 span{color:var(--gold)}
.hero p{margin:0 0 16px;color:#d5ddef;max-width:640px}
.tagline{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:700;border-radius:6px;padding:8px 14px}

.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0}
.pillar{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;cursor:pointer}
.pillar:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(13,35,80,.14)}
.pillar .ph{background:var(--c);color:#fff;padding:16px 18px}
.pillar .ph h2{margin:0;font-size:21px}
.pillar .ph div{font-size:13px;opacity:.9}
.pillar .pq{font-size:12.5px;color:var(--muted);padding:12px 18px 0;font-style:italic}
.pillar .pb{padding:10px 18px 16px;display:grid;gap:8px;flex:1}
.pstat{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px;font-size:13.5px}
.pstat b{font-size:16px}
.pillar .go{padding:10px 18px;border-top:1px solid var(--line);font-weight:700;color:var(--c);font-size:13.5px}

.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin:0 0 4px;font-size:16px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.cards{display:grid;gap:16px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#f8fafd}
.tbl-wrap{overflow-x:auto}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.good{background:var(--good-bg);color:var(--good)} .warn{background:var(--warn-bg);color:var(--warn)}
.bad{background:var(--bad-bg);color:var(--bad)} .info{background:var(--info-bg);color:var(--info)} .mute{background:var(--mute-bg);color:var(--muted)}

/* deadlines */
.dl{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.dl:last-child{border-bottom:0}
.date{min-width:52px;text-align:center;border-radius:8px;background:var(--mute-bg);padding:4px 0;line-height:1.1}
.date b{display:block;font-size:18px} .date span{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700}
.dl .t{font-weight:600;font-size:14px} .dl .m{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* section page */
.shead{background:var(--sec);color:#fff;border-radius:16px 16px 0 0;padding:20px 24px 0}
.shead .eyebrow{color:rgba(255,255,255,.75)}
.shead h1{margin:2px 0 2px;font-size:28px}
.shead p{margin:0 0 14px;opacity:.9}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:10px 10px 0 0;font-weight:700;color:rgba(255,255,255,.85);background:rgba(255,255,255,.08)}
.tab:hover{background:rgba(255,255,255,.16)}
.tab.on{background:var(--bg);color:var(--sec)}
.sbody{padding:18px 0 0}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sec);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;margin:4px 0 2px;line-height:1.15}
.kpi .s{font-size:12.5px;color:var(--muted)}

/* bars */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(150px,1.3fr) 56px 2fr 54px;gap:10px;align-items:center;font-size:13.5px}
.bar-row .w{font-size:12px;color:var(--muted);text-align:right}
.track{height:12px;background:var(--mute-bg);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--sec)}
.fill.lo{background:var(--bad)} .fill.mid{background:var(--gold)} .fill.hi{background:var(--good)}
.bar-row .val{font-weight:700;text-align:right}
.bar-row .lab small{display:block;color:var(--muted);font-size:11.5px}

/* stepper */
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;counter-reset:s}
.step{text-align:center;font-size:12px;color:var(--muted);position:relative}
.step .d{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:800;background:var(--mute-bg);color:var(--muted);position:relative;z-index:1}
.step:before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:3px;background:var(--line)}
.step:first-child:before{display:none}
.step.done .d{background:var(--sec);color:#fff} .step.done:before,.step.cur:before{background:var(--sec)}
.step.cur .d{background:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 4px rgba(233,184,36,.3)}
.step.cur{color:var(--ink);font-weight:700}

/* ladder */
.ladder{display:grid;gap:6px}
.rung{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;background:var(--mute-bg);font-size:13.5px}
.rung b{min-width:64px}
.rung.now{background:var(--sec);color:#fff}
.rung.target{outline:2px dashed var(--gold);background:#fffaf0}
.rung .pill{margin-left:auto}

/* pipeline cards */
.pipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pipe h4{margin:0;font-size:17px}
.pipe .for{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.dots{display:flex;gap:4px;margin:8px 0 6px}
.dots i{flex:1;height:8px;border-radius:4px;background:var(--mute-bg)}
.dots i.on{background:var(--sec)}
.pipe .stage{font-size:13px;font-weight:700}

.sdgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.sdg{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--mute-bg);color:var(--muted);position:relative}
.sdg.sel{background:var(--sec);color:#fff}
.sdg small{position:absolute;bottom:4px;font-size:9px;font-weight:700;letter-spacing:.4px}

.stars{color:var(--gold);font-size:22px;letter-spacing:2px}
.stars .off{color:#d7dbe4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.mini-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.foot{color:var(--muted);font-size:12px;text-align:center;padding:24px 0 10px}
.flag{white-space:nowrap;display:inline-block;margin-bottom:2px;font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-right:3px;color:var(--muted)}
.flag.y{border-color:var(--good);color:var(--good)}

.card .sub,.kpi .s,.pillar .pq,.hero p,.note,.bar-row .lab small,.foot,.pipe .for{display:none}
.hero{padding:30px 34px}
.hero h1{margin:10px 0 22px}
@media (max-width:1000px){
  .pillars{grid-template-columns:repeat(2,1fr)} .grid2,.row2,.row3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:600px){
  .top{position:static} .top-in{padding:10px 16px} .brand{min-width:0} .brand div{min-width:0} .brand b{font-size:14px} .brand small{display:none}
  .wrap{padding:16px} .pillars,.kpis{grid-template-columns:1fr} .hero h1{font-size:26px}
  .inst select{min-width:0;width:100%} .inst{width:100%}
  .bar-row{grid-template-columns:1fr 44px;} .bar-row .track{grid-column:1/-1} .bar-row .w{display:none}
  .steps{grid-auto-flow:row;grid-auto-columns:auto} .step:before{display:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/"><div class="mark">IQAC</div><div><b>Accreditation, Ranking, Awards &amp; Recognition</b><small>University Excellence 360° · Quality Recognition Dashboard</small></div></a>
    <div class="spacer"></div>
    <label class="inst">Viewing
      <select id="inst"></select>
    </label>
    <span class="chip-sample">Sample data · mockup</span>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="foot">Frameworks and weights follow the IQAC Quality Recognition Handbook (Complete Edition). All figures on this page are illustrative.</div>

<script>
/* ---------- config ---------- */
const INSTITUTIONS = [
  ['all','All schools (university view)'],
  ['eng','School of Engineering'],
  ['mgmt','School of Management'],
  ['law','School of Law'],
  ['design','School of Design'],
  ['science','School of Science'],
  ['arch','School of Architecture'],
  ['hosp','School of Hospitality'],
  ['lib','School of Liberal Arts'],
  ['film','School of Film & Media'],
];
const SECTIONS = {
  accreditation:{title:'Accreditation',q:'Do we meet the standard?',items:'NAAC · NBA · International',color:'#1f5fae',
    tabs:[['naac','NAAC'],['nba','NBA'],['intl','International']]},
  ranking:{title:'Ranking',q:'How do we compare?',items:'NIRF · QS · THE',color:'#1e7a45',
    tabs:[['nirf','NIRF'],['qs','QS'],['the','THE']]},
  ratings:{title:'Ratings',q:'How good are we on a fixed scale?',items:'IIC · GreenMetric · Others',color:'#c4561b',
    tabs:[['qsstars','QS Stars'],['igauge','QS I-GAUGE'],['iic','IIC'],['greenmetric','GreenMetric'],['iso','ISO & NABL']]},
  awards:{title:'Awards',q:'What makes us stand out?',items:'National & global honours',color:'#963a14',
    tabs:[['institution','Institution'],['faculty','Faculty'],['student','Student']]},
};

/* ---------- deterministic sample data per institution ---------- */
let INST = 'all';
try{ INST = localStorage.getItem('arr-inst') || 'all' }catch(e){}
if(!INSTITUTIONS.some(i=>i[0]===INST)) INST='all';
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function v(key,base,spread,min=0,max=100,inst=INST){const r=((hash(inst+'|'+key)%10007)/10007-.5)*2;return Math.round(Math.max(min,Math.min(max,base+r*spread)))}
function pick(key,arr,inst=INST){return arr[hash(inst+'|'+key)%arr.length]}
const instName = id => (INSTITUTIONS.find(i=>i[0]===id)||[])[1];

/* ---------- small render helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pill = (t,tone='mute') => `<span class="pill ${tone}">${esc(t)}</span>`;
const kpi = (l,val,s='') => `<div class="kpi"><div class="l">${l}</div><div class="v">${val}</div><div class="s">${s}</div></div>`;
const kpis = arr => `<div class="kpis">${arr.join('')}</div>`;
const card = (title,sub,body,extra='') => `<section class="card" ${extra}><h3>${title}</h3>${sub?`<p class="sub">${sub}</p>`:''}${body}</section>`;
function bars(items){ // {label, small, weight, score, suffix}
  return `<div class="bars">${items.map(i=>{
    const cls = i.neutral?'sec':i.score<45?'lo':i.score<65?'mid':'hi';
    return `<div class="bar-row"><div class="lab">${esc(i.label)}${i.small?`<small>${esc(i.small)}</small>`:''}</div>
      <div class="w">${i.weight??''}</div><div class="track"><div class="fill ${cls}" style="width:${i.score}%"></div></div>
      <div class="val">${i.display??i.score+(i.suffix??'%')}</div></div>`}).join('')}</div>`;
}
const table = (head,rows) => `<div class="tbl-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function steps(list,cur){return `<div class="steps">${list.map((s,i)=>`<div class="step ${i<cur?'done':i===cur?'cur':''}"><div class="d">${i<cur?'✓':i+1}</div>${esc(s)}</div>`).join('')}</div>`}
const stars = (n,max=5) => `<span class="stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(max-n)}</span></span>`;
const meterTone = p => p>=75?'good':p>=50?'warn':'bad';

/* ---------- HOME ---------- */
function snapshotRows(){
  return INSTITUTIONS.slice(1).map(([id,name])=>{
    const ev = v('naacev',70,25,20,100,id);
    const nirfCat = {eng:'Engineering',mgmt:'Management',law:'Law',arch:'Architecture & Planning'}[id];
    const nbaTot = {eng:8,mgmt:2}[id];
    const nbaOk = nbaTot? v('nbaok',nbaTot-1,1,0,nbaTot,id):0;
    const nirf = nirfCat ? pick('nirfband',['Rank 78','101-150','151-200','Rank 64','Not ranked'],id) : null;
    const iic = v('iic',3.5,1.6,1,5,id);
    const aw = v('awards',22,14,4,60,id);
    const ready = v('ready',68,22,20,98,id);
    return [`<b>${esc(name)}</b>`, `<span class="pill ${meterTone(ev)}">${ev}%</span>`,
      nbaTot?`${nbaOk} / ${nbaTot} programmes`:'<span class="pill mute">N/A</span>',
      nirf ? `${pill(nirf, nirf==='Not ranked'?'mute':'info')} <small style="color:var(--muted)">${nirfCat}</small>` : '<span class="pill mute">Overall only</span>', stars(iic), `<b>${aw}</b>`,
      `<span class="pill ${meterTone(ready)}">${ready}%</span>`];
  });
}
const DEADLINES = [
  ['09','Nov','THE Sustainability Impact Ratings – SDG data deadline','Ranking · THE','#1e7a45'],
  ['14','Nov','NIRF DCS submission (India Rankings 2027)','Ranking · NIRF','#1e7a45'],
  ['30','Nov','NAAC AQAR upload & data cross-check with AISHE','Accreditation · NAAC','#1f5fae'],
  ['15','Dec','IIC Q2 activity reports due on portal','Ratings · IIC','#c4561b'],
  ['10','Jan','QS Hub data window & THE data portal open','Ranking · QS / THE','#1e7a45'],
  ['20','Jan','Society award nominations (IEEE, ISTE, CSI)','Awards · Faculty','#963a14'],
];
function home(){
  const naacReady=v('naac-ready',68,15), nbaOk=v('nba-acc',6,2,0,10), intl=v('intl',1,1,0,3);
  const nirfBand=pick('nirf',['101-150','151-200','Rank 92','Rank 118']), qs=pick('qs',['Asia 451-500','Not yet ranked','Asia 401-450']), the=pick('the',['1201-1500','SDG: 401-600','Not yet ranked']);
  const iic=v('iic',4,1,1,5), gm=pick('gm',['Rank 312','Rank 287','Applied']), isoN=v('iso',2,1,0,4);
  const awInst=v('aw-i',18,8,0,60), awFac=v('aw-f',42,14,0,90), awStu=v('aw-s',96,30,0,200);
  const P = (key,stats,go) => { const s=SECTIONS[key]; return `
    <a class="pillar" href="#/${key}/${s.tabs[0][0]}" style="--c:${s.color}">
      <div class="ph"><h2>${s.title}</h2><div>${s.items}</div></div>
      <div class="pq">${s.q}</div>
      <div class="pb">${stats.map(([l,val])=>`<div class="pstat"><span>${l}</span><b>${val}</b></div>`).join('')}</div>
      <div class="go">Open ${s.title} →</div></a>`};
  return `
  <section class="hero">
    <div class="eyebrow">Quality Recognition Dashboard · ${esc(instName(INST))}</div>
    <h1>Accreditation, <span>Ranking, Awards</span> &amp; Recognition</h1>
    <p>One place to track where every institution stands, what is due next, and what evidence is still missing.</p>
    <span class="tagline">Accredit to assure. Rank to compare. Recognise to inspire.</span>
  </section>
  <div class="pillars">
    ${P('accreditation',[['NAAC readiness',naacReady+'%'],['NBA programmes accredited',nbaOk],['International accreditations',intl]])}
    ${P('ranking',[['NIRF (Overall)',nirfBand],['QS',qs],['THE',the]])}
    ${P('ratings',[['IIC rating',iic+' ★'],['GreenMetric',gm],['ISO / NABL certificates',isoN]])}
    ${P('awards',[['Institution awards',awInst],['Faculty awards (AY)',awFac],['Student awards (AY)',awStu]])}
  </div>
  <div class="grid2">
    ${card('All-school snapshot','Every college in one view — click a pillar above to drill in.',
      table(['School','NAAC evidence','NBA','NIRF','IIC','Awards (AY)','Overall readiness'],snapshotRows()))}
    ${card('Due in the next 90 days','From the integrated recognition calendar · assign an owner to each line',
      DEADLINES.map(([d,m,t,s,c])=>`<div class="dl"><div class="date"><b>${d}</b><span>${m}</span></div><div><div class="t">${t}</div><div class="m"><span class="tag" style="background:${c}"></span>${s}</div></div></div>`).join(''))}
  </div>`;
}

/* ---------- ACCREDITATION ---------- */
const NAAC_ATTR = [
  ['Curriculum Design','Input',75],['Faculty Resources','Input',50],['Infrastructure','Input',50],['Financial Resources & Management','Input',50],
  ['Learning & Teaching','Process',125],['Extended Curricular Engagements','Process',100],['Governance & Administration','Process',100],
  ['Student Outcomes','Outcome',150],['Research & Innovation Outcomes','Outcome',125],['Sustainability Outcomes & Green Initiatives','Outcome',75]];
function naac(){
  const ready=v('naac-ready',68,15), ev=v('ev',412,80,0,580), grade=pick('naacgrade',['A+ (RAF) · valid till Mar 2028','A++ (RAF) · valid till Aug 2029','A (RAF) · valid till Jan 2027'],'all');
  const lvl = pick('mbgl',[1,1,2]), stepNow = v('step',2,1,0,7);
  const attrRows = NAAC_ATTR.map(([n,t,w],i)=>{const p=v('attr'+i,70,25,15,100);return {label:n,small:t+' · '+w+' marks',weight:'',score:p}});
  const ladder = [[5,'Global excellence'],[4,'National excellence'],[3,'Distinguished'],[2,'Performing well'],[1,'Consolidating quality']]

/* ---------- RANKING ---------- */
function trend(points,label){ // points: [[year,rank]] lower is better
  const W=520,H=170,p=34, ys=points.map(x=>x[1]), mx=Math.max(...ys)*1.1, mn=Math.max(0,Math.min(...ys)*.85);
  const X=i=>p+i*(W-2*p)/(points.length-1), Y=r=>p/2+(r-mn)/(mx-mn)*(H-p*1.5);
  const d=points.map((pt,i)=>`${i?'L':'M'}${X(i)},${Y(pt[1])}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label}">
   <line x1="${p}" x2="${W-p}" y1="${H-p+4}" y2="${H-p+4}" stroke="#e1e6ef"/>
   <path d="${d}" fill="none" stroke="var(--sec)" stroke-width="3" stroke-linejoin="round"/>
   ${points.map((pt,i)=>`<circle cx="${X(i)}" cy="${Y(pt[1])}" r="5" fill="#fff" stroke="var(--sec)" stroke-width="3"/>
     <text x="${X(i)}" y="${Y(pt[1])-11}" text-anchor="middle" font-size="13" font-weight="700" fill="#0f1b33">${pt[1]}</text>
     <text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="12" fill="#5b6680">${pt[0]}</text>`).join('')}
  </svg><div class="note">Rank (lower is better) · ${label}</div>`;
}
function nirf(){
  const params=[['TLR','Teaching, Learning & Resources',30],['RP','Research & Professional Practice',30],['GO','Graduation Outcomes',20],['OI','Outreach & Inclusivity',10],['PR','Perception',10]];
  const sc=params.map(([k],i)=>v('nirf'+k,[62,38,71,58,22][i],12));
  const total=params.reduce((a,p,i)=>a+p[2]*sc[i]/100,0).toFixed(1);
  const base=v('nirfbase',120,40,40,220); const pts=[2022,2023,2024,2025,2026].map((y,i)=>[y,Math.max(20,base+(4-i)*v('dr'+i,9,6,0,20))]);
  const cats=[['Overall','Applied'],['Universities','Applied'],['Engineering','Applied'],['Management','Applied'],['Pharmacy','Applied'],['Innovation','Applied'],['SDG (new 2025)','Not applied'],['Research Institutions','Not eligible']];
  return kpis([kpi('Overall score',total,'out of 100 · sample'),kpi('Best rank (2026)',pts[4][1],'Engineering category'),kpi('Categories applied',`${cats.filter(c=>c[1]==='Applied').length} / 17`,'Each category = separate chance'),kpi('DCS submission','14 Nov',pill('Data 82% filled','warn'))])
  + `<div class="row2">
    ${card('Parameter scores','Score = 0.30·TLR + 0.30·RP + 0.20·GO + 0.10·OI + 0.10·PR',bars(params.map(([k,n,w],i)=>({label:`${k} · ${n}`,small:`contributes ${(w*sc[i]/100).toFixed(1)} pts`,weight:w+'%',score:sc[i]}))))}
    ${card('Rank trend','Engineering category, last five cycles',trend(pts,'NIRF Engineering'))}
  </div><div style="height:16px"></div>
  ${card('Categories','Apply in Overall and in every subject category where eligible',table(['Category','Status','2026 result','Owner'],
    cats.map(([c,s],i)=>[`<b>${c}</b>`,pill(s,s==='Applied'?'good':s==='Not applied'?'warn':'mute'),s==='Applied'?pick('cr'+c,['Rank 78','101-150','151-200','Band 51-100','Rank 64']):'—',pick('ow'+i,['NIRF Cell','Dean Academics','IQAC Director','Innovation Cell'])])))}`;
}

function render(){
  const [sec,tab] = location.hash.replace(/^#\/?/,'').split('/');
  const app=document.getElementById('app');
  document.documentElement.style.setProperty('--sec', SECTIONS[sec]?.color || '#0d2350');
  if(!SECTIONS[sec]){ app.innerHTML=home(); window.scrollTo(0,0); return; }
  const S=SECTIONS[sec], t = S.tabs.some(x=>x[0]===tab)?tab:S.tabs[0][0];
  app.innerHTML = `<div class="crumbs"><a href="#/">Home</a> › ${S.title} › ${S.tabs.find(x=>x[0]===t)[1]}</div>
   <div class="shead"><div class="eyebrow">${esc(instName(INST))}</div><h1>${S.title}</h1><p>${S.q} · ${S.items}</p>
   <nav class="tabs">${S.tabs.map(([id,l])=>`<a class="tab ${id===t?'on':''}" href="#/${sec}/${id}">${l}</a>`).join('')}</nav></div>
   <div class="sbody">${PAGES[sec][t]()}</div>`;
}
const sel=document.getElementById('inst');
sel.innerHTML=INSTITUTIONS.map(([id,n])=>`<option value="${id}">${n}</option>`).join('');
sel.value=INST;
sel.onchange=()=>{INST=sel.value;try{localStorage.setItem('arr-inst',INST)}catch(e){};render()};
window.addEventListener('hashchange',render);
render();
